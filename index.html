<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtendeIA - Gestão de Clínicas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #1565c0;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    margin-bottom: 18px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
    color: #1565c0;
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin: 4px;
    background: #1565c0;
    color: white;
}

button:hover {
    opacity: .9;
}

.btn-danger {
    background: #d32f2f;
}

.btn-green {
    background: #2e7d32;
}

.btn-gray {
    background: #666;
}

.item {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.item:last-child {
    border-bottom: none;
}

.chat {
    background: #eef3f8;
    padding: 15px;
    border-radius: 10px;
    min-height: 250px;
    max-height: 450px;
    overflow-y: auto;
}

.mensagem {
    margin: 8px 0;
    padding: 10px 13px;
    border-radius: 12px;
    max-width: 88%;
    line-height: 1.45;
}

.usuario {
    background: #d1e7ff;
    margin-left: auto;
    text-align: right;
}

.ana {
    background: white;
    margin-right: auto;
}

.chat-input {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.chat-input input {
    margin: 0;
    flex: 1;
}

.resumo {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.box {
    background: #e3f2fd;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.box strong {
    display: block;
    font-size: 25px;
    color: #1565c0;
}

.horarios {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-top: 12px;
}

.btn-horario {
    background: #2e7d32;
    margin: 0;
}

.btn-horario:hover {
    background: #1b5e20;
}

.aviso {
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

.sucesso {
    background: #d4edda;
    color: #155724;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
}

@media(max-width:600px) {
    .resumo {
        grid-template-columns: 1fr;
    }

    .horarios {
        grid-template-columns: repeat(2,1fr);
    }

    .chat-input {
        flex-direction: column;
    }

    .chat-input button {
        width: 100%;
        margin: 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>AtendeIA</h1>
    <p>Gestão de Clínicas com Ana - Assistente Virtual</p>
</header>

<div class="container">

<!-- DADOS DA CLÍNICA -->
<div class="card">
    <h2>🏥 Dados da Clínica</h2>

    <label>Nome da clínica</label>
    <input id="nomeClinica">

    <label>Telefone / WhatsApp</label>
    <input id="telefoneClinica">

    <label>Endereço</label>
    <input id="enderecoClinica">

    <label>Horário de atendimento</label>
    <input id="horarioClinica"
           placeholder="Ex.: Segunda a sexta, 08:00 às 18:00">

    <button onclick="salvarClinica()">
        Salvar dados da clínica
    </button>

    <div id="msgClinica"></div>
</div>


<!-- CONFIGURAÇÃO DA ANA -->
<div class="card">
    <h2>🤖 Configuração do Atendente IA</h2>

    <label>Nome do atendente</label>
    <input id="nomeIA" placeholder="Ana">

    <label>Mensagem inicial</label>
    <textarea id="mensagemIA"></textarea>

    <label>Instruções para o atendente</label>
    <textarea id="instrucoesIA"></textarea>

    <button onclick="salvarIA()">
        Salvar configuração da IA
    </button>

    <div id="msgIA"></div>
</div>


<!-- SERVIÇOS -->
<div class="card">
    <h2>💰 Serviços da Clínica</h2>

    <label>Nome do serviço</label>
    <input id="nomeServico"
           placeholder="Ex.: Tratamento">

    <label>Valor</label>
    <input id="valorServico"
           placeholder="Ex.: 120,00">

    <button onclick="adicionarServico()">
        Adicionar serviço
    </button>

    <div id="listaServicos"></div>
</div>


<!-- AGENDAMENTOS -->
<div class="card">
    <h2>📅 Agendamentos</h2>

    <label>Paciente</label>
    <input id="pacienteAgendamento">

    <label>Data</label>
    <input id="dataAgendamento" type="date">

    <label>Horário</label>
    <select id="horaAgendamento">
        <option value="">Selecione o horário</option>
    </select>

    <label>Serviço</label>
    <select id="servicoAgendamento">
        <option value="">Selecione o serviço</option>
    </select>

    <button class="btn-green"
            onclick="adicionarAgendamentoManual()">
        Adicionar agendamento
    </button>

    <div id="listaAgendamentos"></div>
</div>


<!-- CHAT -->
<div class="card">
    <h2>💬 Chat da Ana</h2>

    <button class="btn-gray"
            onclick="novoAtendimento()">
        Novo atendimento
    </button>

    <div id="chat" class="chat"></div>

    <div class="chat-input">
        <input id="mensagemUsuario"
               placeholder="Digite sua mensagem..."
               onkeydown="if(event.key==='Enter') enviarMensagem()">

        <button onclick="enviarMensagem()">
            Enviar
        </button>
    </div>
</div>


<!-- RESUMO -->
<div class="card">
    <h2>📊 Resumo</h2>

    <div class="resumo">

        <div class="box">
            <strong id="totalServicos">0</strong>
            Serviços
        </div>

        <div class="box">
            <strong id="totalAgendamentos">0</strong>
            Agendamentos
        </div>

        <div class="box">
            <strong id="totalHoje">0</strong>
            Hoje
        </div>

    </div>
</div>

</div>


<script>

/* =====================================================
   DADOS
===================================================== */

let servicos =
    JSON.parse(localStorage.getItem("servicosAtendeIA") || "[]");

let agendamentos =
    JSON.parse(localStorage.getItem("agendamentosAtendeIA") || "[]");


let estadoAgendamento = {
    ativo: false,
    etapa: "",
    paciente: "",
    servico: "",
    data: "",
    hora: ""
};


/* =====================================================
   HORÁRIOS DA CLÍNICA
   08:00 ATÉ 18:00
   DE 1 EM 1 HORA
===================================================== */

const horariosDisponiveis = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
];


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data) {

    if (!data) return "";

    let partes = data.split("-");

    if (partes.length !== 3) return data;

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


/* =====================================================
   FORMATAR VALOR
===================================================== */

function formatarValor(valor) {

    let numero = Number(
        String(valor)
        .replace("R$","")
        .replace(/\./g,"")
        .replace(",",".")
        .trim()
    );

    if (isNaN(numero)) return valor;

    return numero.toLocaleString("pt-BR", {
        style:"currency",
        currency:"BRL"
    });
}


/* =====================================================
   SALVAR CLÍNICA
===================================================== */

function salvarClinica() {

    let dados = {
        nome: document.getElementById("nomeClinica").value,
        telefone: document.getElementById("telefoneClinica").value,
        endereco: document.getElementById("enderecoClinica").value,
        horario: document.getElementById("horarioClinica").value
    };

    localStorage.setItem(
        "clinicaAtendeIA",
        JSON.stringify(dados)
    );

    document.getElementById("msgClinica").innerHTML =
        '<div class="sucesso">✅ Dados da clínica salvos.</div>';
}


/* =====================================================
   SALVAR IA
===================================================== */

function salvarIA() {

    let config = {

        nome:
            document.getElementById("nomeIA").value || "Ana",

        mensagem:
            document.getElementById("mensagemIA").value ||
            "Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?",

        instrucoes:
            document.getElementById("instrucoesIA").value
    };

    localStorage.setItem(
        "configIAAtendeIA",
        JSON.stringify(config)
    );

    document.getElementById("msgIA").innerHTML =
        '<div class="sucesso">✅ Configuração da Ana salva.</div>';

    iniciarChat();
}


/* =====================================================
   SERVIÇOS
===================================================== */

function adicionarServico() {

    let nome =
        document.getElementById("nomeServico").value.trim();

    let valor =
        document.getElementById("valorServico").value.trim();

    if (!nome || !valor) {

        alert("Informe o nome e o valor do serviço.");
        return;
    }

    servicos.push({
        nome:nome,
        valor:valor
    });

    localStorage.setItem(
        "servicosAtendeIA",
        JSON.stringify(servicos)
    );

    document.getElementById("nomeServico").value = "";
    document.getElementById("valorServico").value = "";

    mostrarServicos();
    atualizarSelectServicos();
    mostrarResumo();
}


function removerServico(index) {

    if (!confirm("Deseja remover este serviço?")) return;

    servicos.splice(index,1);

    localStorage.setItem(
        "servicosAtendeIA",
        JSON.stringify(servicos)
    );

    mostrarServicos();
    atualizarSelectServicos();
    mostrarResumo();
}


function mostrarServicos() {

    let div =
        document.getElementById("listaServicos");

    if (servicos.length === 0) {

        div.innerHTML =
            "<p>Nenhum serviço cadastrado.</p>";

        return;
    }

    div.innerHTML =
        servicos.map((servico,index)=>`

            <div class="item">

                <strong>${servico.nome}</strong><br>

                ${formatarValor(servico.valor)}

                <br>

                <button
                    class="btn-danger"
                    onclick="removerServico(${index})">

                    Remover

                </button>

            </div>

        `).join("");
}


function atualizarSelectServicos() {

    let select =
        document.getElementById("servicoAgendamento");

    select.innerHTML =
        '<option value="">Selecione o serviço</option>';

    servicos.forEach(servico=>{

        let option =
            document.createElement("option");

        option.value =
            servico.nome;

        option.textContent =
            `${servico.nome} - ${formatarValor(servico.valor)}`;

        select.appendChild(option);
    });
}


/* =====================================================
   VERIFICAR HORÁRIO OCUPADO
===================================================== */

function horarioOcupado(data,hora) {

    return agendamentos.some(a =>

        a.data === data &&
        a.hora === hora

    );
}


/* =====================================================
   HORÁRIOS DISPONÍVEIS
===================================================== */

function obterHorariosDisponiveis(data) {

    if (!data) {

        return horariosDisponiveis;
    }

    return horariosDisponiveis.filter(hora =>

        !horarioOcupado(data,hora)

    );
}


/* =====================================================
   ATUALIZAR HORÁRIOS DO FORMULÁRIO
===================================================== */

function atualizarHorariosFormulario() {

    let data =
        document.getElementById("dataAgendamento").value;

    let select =
        document.getElementById("horaAgendamento");

    select.innerHTML =
        '<option value="">Selecione o horário</option>';

    let horarios =
        obterHorariosDisponiveis(data);

    horarios.forEach(hora=>{

        let option =
            document.createElement("option");

        option.value = hora;

        option.textContent = hora;

        select.appendChild(option);
    });


    if (data && horarios.length === 0) {

        select.innerHTML =
            '<option value="">Nenhum horário disponível</option>';
    }
}


/* =====================================================
   EVENTO DATA DO FORMULÁRIO
===================================================== */

document.addEventListener("DOMContentLoaded",function(){

    let campoData =
        document.getElementById("dataAgendamento");

    if (campoData) {

        campoData.addEventListener(
            "change",
            atualizarHorariosFormulario
        );
    }
});


/* =====================================================
   ADICIONAR AGENDAMENTO MANUAL
===================================================== */

function adicionarAgendamentoManual() {

    let paciente =
        document.getElementById("pacienteAgendamento").value.trim();

    let data =
        document.getElementById("dataAgendamento").value;

    let hora =
        document.getElementById("horaAgendamento").value;

    let servico =
        document.getElementById("servicoAgendamento").value;


    if (!paciente || !data || !hora || !servico) {

        alert("Preencha todos os campos do agendamento.");
        return;
    }


    if (horarioOcupado(data,hora)) {

        alert(
            "⚠️ Esse horário já está ocupado. " +
            "Escolha outro horário."
        );

        atualizarHorariosFormulario();

        return;
    }


    agendamentos.push({

        paciente:paciente,
        data:data,
        hora:hora,
        servico:servico

    });


    localStorage.setItem(
        "agendamentosAtendeIA",
        JSON.stringify(agendamentos)
    );


    document.getElementById("pacienteAgendamento").value = "";
    document.getElementById("dataAgendamento").value = "";
    document.getElementById("horaAgendamento").value = "";
    document.getElementById("servicoAgendamento").value = "";


    atualizarHorariosFormulario();
    mostrarAgendamentos();
    mostrarResumo();

    alert("✅ Agendamento realizado com sucesso!");
}


/* =====================================================
   REMOVER AGENDAMENTO
===================================================== */

function removerAgendamento(index) {

    if (!confirm("Deseja cancelar este agendamento?")) return;

    agendamentos.splice(index,1);

    localStorage.setItem(
        "agendamentosAtendeIA",
        JSON.stringify(agendamentos)
    );

    mostrarAgendamentos();
    mostrarResumo();

    atualizarHorariosFormulario();
}


/* =====================================================
   MOSTRAR AGENDAMENTOS
===================================================== */

function mostrarAgendamentos() {

    let div =
        document.getElementById("listaAgendamentos");

    if (agendamentos.length === 0) {

        div.innerHTML =
            "<p>Nenhum agendamento cadastrado.</p>";

        return;
    }


    let ordenados =
        [...agendamentos].sort((a,b)=>{

            return `${a.data} ${a.hora}`
                .localeCompare(
                    `${b.data} ${b.hora}`
                );
        });


    div.innerHTML =
        ordenados.map(agendamento=>{

            let index =
                agendamentos.indexOf(agendamento);

            return `

                <div class="item">

                    <strong>
                        ${agendamento.paciente}
                    </strong>

                    <br>

                    📅 ${formatarData(agendamento.data)}

                    <br>

                    🕐 ${agendamento.hora}

                    <br>

                    💼 ${agendamento.servico}

                    <br>

                    <button
                        class="btn-danger"
                        onclick="removerAgendamento(${index})">

                        Cancelar

                    </button>

                </div>

            `;

        }).join("");
}


/* =====================================================
   CHAT
===================================================== */

function adicionarMensagem(texto,tipo) {

    let chat =
        document.getElementById("chat");

    let div =
        document.createElement("div");

    div.className =
        `mensagem ${tipo}`;

    div.innerHTML =
        texto.replace(/\n/g,"<br>");

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


function iniciarChat() {

    let config =
        JSON.parse(
            localStorage.getItem("configIAAtendeIA") || "{}"
        );

    let mensagem =
        config.mensagem ||
        "Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?";

    document.getElementById("chat").innerHTML = "";

    adicionarMensagem(
        mensagem,
        "ana"
    );
}


function novoAtendimento() {

    estadoAgendamento = {

        ativo:false,
        etapa:"",
        paciente:"",
        servico:"",
        data:"",
        hora:""

    };

    iniciarChat();
}


/* =====================================================
   INICIAR AGENDAMENTO
===================================================== */

function iniciarAgendamento() {

    if (servicos.length === 0) {

        adicionarMensagem(
            "No momento ainda não há serviços cadastrados. Por favor, cadastre um serviço antes de realizar o agendamento.",
            "ana"
        );

        return;
    }


    estadoAgendamento = {

        ativo:true,
        etapa:"nome",
        paciente:"",
        servico:"",
        data:"",
        hora:""

    };


    adicionarMensagem(
        "Claro! 😊 Vamos fazer seu agendamento.\n\nQual é o seu nome?",
        "ana"
    );
}


/* =====================================================
   LISTA DE SERVIÇOS
===================================================== */

function textoServicos() {

    if (servicos.length === 0) {

        return "No momento não temos serviços cadastrados.";
    }


    let texto =
        "📋 Nossos serviços:\n\n";


    servicos.forEach(servico=>{

        texto +=
            `• ${servico.nome} — ${formatarValor(servico.valor)}\n`;

    });


    return texto;
}


/* =====================================================
   MOSTRAR HORÁRIOS NO CHAT
===================================================== */

function textoHorariosDisponiveis(data) {

    let horarios =
        obterHorariosDisponiveis(data);


    if (horarios.length === 0) {

        return (
            "⚠️ Não há horários disponíveis para essa data.\n\n" +
            "Por favor, escolha outra data."
        );
    }


    let texto =
        `📅 ${formatarData(data)}\n\n` +
        "🟢 Horários disponíveis:\n\n";


    horarios.forEach(hora=>{

        texto +=
            `• ${hora}\n`;

    });


    texto +=
        "\nQual horário você deseja?";


    return texto;
}


/* =====================================================
   PROCESSAR AGENDAMENTO
===================================================== */

function processarAgendamento(textoOriginal) {

    let texto =
        textoOriginal.trim();

    let normalizado =
        normalizarTexto(texto);


    /* NOME */

    if (estadoAgendamento.etapa === "nome") {

        estadoAgendamento.paciente =
            texto;

        estadoAgendamento.etapa =
            "servico";


        adicionarMensagem(
            `Prazer, ${texto}! 😊\n\nQual serviço você deseja agendar?\n\n${textoServicos()}`,
            "ana"
        );

        return;
    }


    /* SERVIÇO */

    if (estadoAgendamento.etapa === "servico") {

        let servicoEncontrado =
            servicos.find(servico=>

                normalizarTexto(servico.nome)
                === normalizado

            );


        if (!servicoEncontrado) {

            servicoEncontrado =
                servicos.find(servico=>

                    normalizado.includes(
                        normalizarTexto(servico.nome)
                    )

                );
        }


        if (!servicoEncontrado) {

            adicionarMensagem(
                "Não encontrei esse serviço cadastrado. 😊\n\n" +
                textoServicos() +
                "\n\nDigite o nome do serviço.",
                "ana"
            );

            return;
        }


        estadoAgendamento.servico =
            servicoEncontrado.nome;

        estadoAgendamento.etapa =
            "data";


        adicionarMensagem(
            `Perfeito! Você escolheu ${servicoEncontrado.nome} — ${formatarValor(servicoEncontrado.valor)}.\n\nQual data você deseja?\n\nDigite no formato DD/MM/AAAA.`,
            "ana"
        );

        return;
    }


    /* DATA */

    if (estadoAgendamento.etapa === "data") {

        let dataValida =
            converterDataParaISO(texto);


        if (!dataValida) {

            adicionarMensagem(
                "Não consegui identificar a data. 😕\n\nDigite, por exemplo:\n20/09/2026",
                "ana"
            );

            return;
        }


        if (dataPassou(dataValida)) {

            adicionarMensagem(
                "Essa data já passou. 📅\n\nInforme uma data futura.",
                "ana"
            );

            return;
        }


        let horarios =
            obterHorariosDisponiveis(dataValida);


        if (horarios.length === 0) {

            adicionarMensagem(
                "⚠️ Essa data está completamente ocupada.\n\nPor favor, escolha outra data.",
                "ana"
            );

            return;
        }


        estadoAgendamento.data =
            dataValida;

        estadoAgendamento.etapa =
            "hora";


        adicionarMensagem(
            textoHorariosDisponiveis(dataValida),
            "ana"
        );

        return;
    }


    /* HORA */

    if (estadoAgendamento.etapa === "hora") {

        let horaValida =
            normalizarHora(texto);


        if (!horaValida) {

            adicionarMensagem(
                "Não consegui identificar o horário. 🕐\n\nEscolha um horário da lista, por exemplo: 14:00.",
                "ana"
            );

            return;
        }


        if (!horariosDisponiveis.includes(horaValida)) {

            adicionarMensagem(
                "⚠️ Esse horário não faz parte dos horários de atendimento.\n\n" +
                textoHorariosDisponiveis(
                    estadoAgendamento.data
                ),
                "ana"
            );

            return;
        }


        if (
            horarioOcupado(
                estadoAgendamento.data,
                horaValida
            )
        ) {

            adicionarMensagem(
                "⚠️ Esse horário acabou de ser ocupado.\n\n" +
                textoHorariosDisponiveis(
                    estadoAgendamento.data
                ),
                "ana"
            );

            return;
        }


        estadoAgendamento.hora =
            horaValida;

        estadoAgendamento.etapa =
            "confirmacao";


        adicionarMensagem(
            `Confira seu agendamento:\n\n` +

            `👤 Paciente: ${estadoAgendamento.paciente}\n` +

            `💼 Serviço: ${estadoAgendamento.servico}\n` +

            `📅 Data: ${formatarData(estadoAgendamento.data)}\n` +

            `🕐 Horário: ${estadoAgendamento.hora}\n\n` +

            `Deseja confirmar o agendamento?\n\n` +

            `Digite SIM para confirmar ou NÃO para cancelar.`,
            "ana"
        );

        return;
    }


    /* CONFIRMAÇÃO */

    if (estadoAgendamento.etapa === "confirmacao") {

        if (
            normalizado === "sim" ||
            normalizado === "s" ||
            normalizado === "confirmo" ||
            normalizado === "confirmar"
        ) {


            if (
                horarioOcupado(
                    estadoAgendamento.data,
                    estadoAgendamento.hora
                )
            ) {

                adicionarMensagem(
                    "⚠️ Esse horário foi ocupado enquanto aguardávamos sua confirmação.\n\nVou mostrar novamente os horários disponíveis.",
                    "ana"
                );


                estadoAgendamento.etapa =
                    "hora";


                adicionarMensagem(
                    textoHorariosDisponiveis(
                        estadoAgendamento.data
                    ),
                    "ana"
                );

                return;
            }


            agendamentos.push({

                paciente:
                    estadoAgendamento.paciente,

                servico:
                    estadoAgendamento.servico,

                data:
                    estadoAgendamento.data,

                hora:
                    estadoAgendamento.hora

            });


            localStorage.setItem(
                "agendamentosAtendeIA",
                JSON.stringify(agendamentos)
            );


            adicionarMensagem(
                `✅ Agendamento confirmado com sucesso!\n\n` +

                `👤 ${estadoAgendamento.paciente}\n` +

                `💼 ${estadoAgendamento.servico}\n` +

                `📅 ${formatarData(estadoAgendamento.data)}\n` +

                `🕐 ${estadoAgendamento.hora}\n\n` +

                `Esperamos você! 😊`,
                "ana"
            );


            estadoAgendamento = {

                ativo:false,
                etapa:"",
                paciente:"",
                servico:"",
                data:"",
                hora:""

            };


            mostrarAgendamentos();
            mostrarResumo();

            return;
        }


        if (
            normalizado === "nao" ||
            normalizado === "não" ||
            normalizado === "n" ||
            normalizado === "cancelar"
        ) {

            adicionarMensagem(
                "Tudo bem! 😊 O agendamento foi cancelado. Se precisar, posso ajudar com um novo agendamento.",
                "ana"
            );


            estadoAgendamento = {

                ativo:false,
                etapa:"",
                paciente:"",
                servico:"",
                data:"",
                hora:""

            };

            return;
        }


        adicionarMensagem(
            "Por favor, responda SIM para confirmar ou NÃO para cancelar.",
            "ana"
        );
    }
}


/* =====================================================
   CONVERTER DATA
===================================================== */

function converterDataParaISO(texto) {

    texto = texto.trim();


    let match =
        texto.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
        );


    if (match) {

        let dia =
            parseInt(match[1]);

        let mes =
            parseInt(match[2]);

        let ano =
            parseInt(match[3]);


        let data =
            new Date(
                ano,
                mes - 1,
                dia
            );


        if (
            data.getFullYear() === ano &&
            data.getMonth() === mes - 1 &&
            data.getDate() === dia
        ) {

            return (
                ano + "-" +
                String(mes).padStart(2,"0") + "-" +
                String(dia).padStart(2,"0")
            );
        }
    }


    return null;
}


/* =====================================================
   DATA PASSOU
===================================================== */

function dataPassou(dataISO) {

    let hoje =
        new Date();

    hoje.setHours(0,0,0,0);


    let partes =
        dataISO.split("-");


    let data =
        new Date(
            parseInt(partes[0]),
            parseInt(partes[1])-1,
            parseInt(partes[2])
        );


    data.setHours(0,0,0,0);


    return data < hoje;
}


/* =====================================================
   NORMALIZAR HORA
===================================================== */

function normalizarHora(texto) {

    texto =
        texto
        .trim()
        .replace(".",":")
        .replace("h",":")
        .replace("H",":");


    let match =
        texto.match(
            /^(\d{1,2}):?(\d{2})$/
        );


    if (!match) return null;


    let hora =
        parseInt(match[1]);

    let minuto =
        parseInt(match[2]);


    if (
        hora < 0 ||
        hora > 23 ||
        minuto < 0 ||
        minuto > 59
    ) {

        return null;
    }


    return (
        String(hora).padStart(2,"0") +
        ":" +
        String(minuto).padStart(2,"0")
    );
}

function enviarMensagem() {

    let texto =

    if (!texto) return;


    adicionarMensagem(
        texto,
        "usuario"
    );


    input.value = "";


    setTimeout(()=>{

    },300);
}
