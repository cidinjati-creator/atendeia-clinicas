<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtendeIA - Gestão de Clínicas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6f9;
    color: #1f2937;
}

header {
    background: linear-gradient(135deg, #0d6efd, #084298);
    color: white;
    padding: 22px 15px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: 0.95;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
    color: #0d6efd;
    font-size: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
    margin-bottom: 5px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd3da;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #0d6efd;
    color: white;
    width: 100%;
    margin-top: 15px;
}

.btn-primary:hover {
    background: #084298;
}

.btn-success {
    background: #198754;
    color: white;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.info {
    background: #e7f1ff;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 14px;
}

.servico-item,
.agendamento-item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    background: #fafafa;
}

.servico-item strong,
.agendamento-item strong {
    color: #0d6efd;
}

.chat {
    background: #e5ddd5;
    border-radius: 14px;
    padding: 12px;
    min-height: 420px;
    max-height: 650px;
    overflow-y: auto;
}

.mensagem {
    margin: 8px 0;
    display: flex;
}

.mensagem.ana {
    justify-content: flex-start;
}

.mensagem.usuario {
    justify-content: flex-end;
}

.balao {
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-line;
}

.mensagem.ana .balao {
    background: white;
    border-bottom-left-radius: 4px;
}

.mensagem.usuario .balao {
    background: #d9fdd3;
    border-bottom-right-radius: 4px;
}

.chat-input-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.chat-input-area input {
    flex: 1;
}

.chat-input-area button {
    background: #0d6efd;
    color: white;
    min-width: 80px;
}

.horarios-chat {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 12px 0;
}

.horario-btn {
    background: white;
    color: #0d6efd;
    border: 2px solid #0d6efd;
    padding: 11px 5px;
    border-radius: 10px;
    font-weight: bold;
}

.horario-btn:hover {
    background: #0d6efd;
    color: white;
}

.horario-btn:disabled {
    background: #ddd;
    color: #888;
    border-color: #bbb;
    cursor: not-allowed;
}

.acao-data {
    margin-top: 10px;
}

.btn-outra-data {
    background: #6c757d;
    color: white;
    width: 100%;
}

.resumo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.resumo-box {
    background: #f1f5f9;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
}

.resumo-box strong {
    display: block;
    font-size: 25px;
    color: #0d6efd;
}

.pequeno {
    font-size: 13px;
    color: #666;
}

.linha {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.confirmacao {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
}

.botoes-confirmacao {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.botoes-confirmacao button {
    flex: 1;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .linha {
        grid-template-columns: 1fr;
    }

    .resumo-grid {
        grid-template-columns: 1fr;
    }

    .horarios-chat {
        grid-template-columns: repeat(3, 1fr);
    }

    .chat-input-area button {
        min-width: 65px;
    }
}
</style>
</head>

<body>

<header>
    <h1>AtendeIA</h1>
    <p>Gestão de Clínicas com Ana - Assistente Virtual</p>
</header>

<div class="container">

    <!-- DADOS DA CLÍNICA -->
    <div class="card">
        <h2>🏥 Dados da Clínica</h2>

        <label>Nome da clínica</label>
        <input id="nomeClinica" placeholder="Digite o nome da clínica">

        <label>Telefone / WhatsApp</label>
        <input id="telefoneClinica" placeholder="Digite o WhatsApp">

        <label>Endereço</label>
        <input id="enderecoClinica" placeholder="Digite o endereço">

        <label>Horário de funcionamento</label>
        <input id="horarioClinica" value="08:00 às 18:00">

        <button class="btn-primary" onclick="salvarClinica()">
            💾 Salvar dados da clínica
        </button>
    </div>


    <!-- CONFIGURAÇÃO DA ANA -->
    <div class="card">
        <h2>🤖 Configuração do Atendente IA</h2>

        <label>Nome da atendente</label>
        <input id="nomeIA" value="Ana">

        <label>Mensagem inicial</label>
        <textarea id="mensagemInicial">Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?</textarea>

        <label>Instruções para a Ana</label>
        <textarea id="instrucoesIA">Seja cordial e profissional. Identifique o que o cliente deseja. Informe corretamente os serviços e valores cadastrados. Ajude o cliente a realizar agendamentos. Não invente informações. Não repita a mesma resposta sem necessidade. Para agendamentos, solicite nome, serviço, data e horário.</textarea>

        <button class="btn-primary" onclick="salvarConfigIA()">
            💾 Salvar configuração da Ana
        </button>
    </div>


    <!-- SERVIÇOS -->
    <div class="card">
        <h2>💰 Serviços da Clínica</h2>

        <label>Nome do serviço</label>
        <input id="nomeServico" placeholder="Ex.: Tratamento">

        <label>Valor</label>
        <input id="valorServico" placeholder="Ex.: 120,00">

        <button class="btn-primary" onclick="adicionarServico()">
            ➕ Adicionar serviço
        </button>

        <div id="listaServicos"></div>
    </div>


    <!-- AGENDAMENTO MANUAL -->
    <div class="card">
        <h2>📅 Agendamento Manual</h2>

        <label>Nome do paciente</label>
        <input id="pacienteManual" placeholder="Nome do paciente">

        <label>Data</label>
        <input type="date" id="dataManual" onchange="atualizarHorariosManuais()">

        <label>Horário</label>
        <select id="horaManual">
            <option value="">Selecione uma data primeiro</option>
        </select>

        <label>Serviço</label>
        <select id="servicoManual"></select>

        <button class="btn-primary" onclick="adicionarAgendamentoManual()">
            📅 Salvar agendamento
        </button>

        <div id="listaAgendamentos"></div>
    </div>


    <!-- CHAT -->
    <div class="card">
        <h2>💬 Chat da Ana</h2>

        <div id="chat" class="chat"></div>

        <div class="chat-input-area">
            <input
                id="entradaChat"
                placeholder="Digite sua mensagem..."
                onkeydown="if(event.key==='Enter') enviarMensagem()"
            >

            <button onclick="enviarMensagem()">
                Enviar
            </button>
        </div>
    </div>


    <!-- RESUMO -->
    <div class="card">
        <h2>📊 Resumo</h2>

        <div class="resumo-grid">
            <div class="resumo-box">
                <strong id="totalServicos">0</strong>
                Serviços
            </div>

            <div class="resumo-box">
                <strong id="totalAgendamentos">0</strong>
                Agendamentos
            </div>

            <div class="resumo-box">
                <strong id="agendamentosHoje">0</strong>
                Hoje
            </div>
        </div>
    </div>

</div>


<script>

/* =========================================================
   DADOS
========================================================= */

let servicos = JSON.parse(
    localStorage.getItem("servicosAtendeIA") || "[]"
);

let agendamentos = JSON.parse(
    localStorage.getItem("agendamentosAtendeIA") || "[]"
);

let configIA = JSON.parse(
    localStorage.getItem("configIAAtendeIA") || "{}"
);

let clinica = JSON.parse(
    localStorage.getItem("clinicaAtendeIA") || "{}"
);


/* =========================================================
   ESTADO DO AGENDAMENTO PELO CHAT
========================================================= */

let estadoAgendamento = {
    ativo: false,
    etapa: "",
    paciente: "",
    servico: "",
    data: "",
    hora: ""
};


/* =========================================================
   HORÁRIOS
========================================================= */

const horariosDisponiveis = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener("DOMContentLoaded", function() {

    carregarDados();

    renderizarServicos();

    renderizarAgendamentos();

    atualizarResumo();

    atualizarSelectServicos();

    iniciarChat();

});


/* =========================================================
   CARREGAR DADOS
========================================================= */

function carregarDados() {

    if (clinica.nome) {
        document.getElementById("nomeClinica").value = clinica.nome;
    }

    if (clinica.telefone) {
        document.getElementById("telefoneClinica").value = clinica.telefone;
    }

    if (clinica.endereco) {
        document.getElementById("enderecoClinica").value = clinica.endereco;
    }

    if (clinica.horario) {
        document.getElementById("horarioClinica").value = clinica.horario;
    }

    if (configIA.nome) {
        document.getElementById("nomeIA").value = configIA.nome;
    }

    if (configIA.mensagemInicial) {
        document.getElementById("mensagemInicial").value =
            configIA.mensagemInicial;
    }

    if (configIA.instrucoes) {
        document.getElementById("instrucoesIA").value =
            configIA.instrucoes;
    }

    if (servicos.length === 0) {

        servicos.push({
            nome: "Tratamento",
            valor: "120,00"
        });

        salvarServicos();
    }
}


/* =========================================================
   CLÍNICA
========================================================= */

function salvarClinica() {

    clinica = {
        nome: document.getElementById("nomeClinica").value.trim(),
        telefone: document.getElementById("telefoneClinica").value.trim(),
        endereco: document.getElementById("enderecoClinica").value.trim(),
        horario: document.getElementById("horarioClinica").value.trim()
    };

    localStorage.setItem(
        "clinicaAtendeIA",
        JSON.stringify(clinica)
    );

    alert("Dados da clínica salvos com sucesso!");
}


/* =========================================================
   CONFIGURAÇÃO DA ANA
========================================================= */

function salvarConfigIA() {

    configIA = {
        nome: document.getElementById("nomeIA").value.trim() || "Ana",

        mensagemInicial:
            document.getElementById("mensagemInicial").value.trim(),

        instrucoes:
            document.getElementById("instrucoesIA").value.trim()
    };

    localStorage.setItem(
        "configIAAtendeIA",
        JSON.stringify(configIA)
    );

    alert("Configuração da Ana salva com sucesso!");

    reiniciarChat();
}


/* =========================================================
   SERVIÇOS
========================================================= */

function adicionarServico() {

    const nome = document
        .getElementById("nomeServico")
        .value
        .trim();

    let valor = document
        .getElementById("valorServico")
        .value
        .trim();

    if (!nome || !valor) {
        alert("Preencha o nome e o valor do serviço.");
        return;
    }

    valor = valor.replace("R$", "").trim();

    servicos.push({
        nome: nome,
        valor: valor
    });

    salvarServicos();

    document.getElementById("nomeServico").value = "";
    document.getElementById("valorServico").value = "";

    renderizarServicos();
    atualizarSelectServicos();
    atualizarResumo();
}


function salvarServicos() {

    localStorage.setItem(
        "servicosAtendeIA",
        JSON.stringify(servicos)
    );
}


function excluirServico(index) {

    if (!confirm("Deseja excluir este serviço?")) {
        return;
    }

    servicos.splice(index, 1);

    salvarServicos();

    renderizarServicos();
    atualizarSelectServicos();
    atualizarResumo();
}


function renderizarServicos() {

    const lista =
        document.getElementById("listaServicos");

    lista.innerHTML = "";

    if (servicos.length === 0) {

        lista.innerHTML =
            '<p class="pequeno">Nenhum serviço cadastrado.</p>';

        return;
    }

    servicos.forEach(function(servico, index) {

        const div = document.createElement("div");

        div.className = "servico-item";

        div.innerHTML = `
            <strong>${escaparHTML(servico.nome)}</strong><br>
            Valor: <strong>R$ ${escaparHTML(servico.valor)}</strong>

            <br><br>

            <button
                class="btn-danger"
                onclick="excluirServico(${index})"
            >
                🗑️ Excluir
            </button>
        `;

        lista.appendChild(div);
    });
}


function atualizarSelectServicos() {

    const select =
        document.getElementById("servicoManual");

    select.innerHTML =
        '<option value="">Selecione o serviço</option>';

    servicos.forEach(function(servico) {

        const option =
            document.createElement("option");

        option.value = servico.nome;

        option.textContent =
            servico.nome + " - R$ " + servico.valor;

        select.appendChild(option);
    });
}


/* =========================================================
   AGENDAMENTOS
========================================================= */

function adicionarAgendamentoManual() {

    const paciente =
        document.getElementById("pacienteManual").value.trim();

    const data =
        document.getElementById("dataManual").value;

    const hora =
        document.getElementById("horaManual").value;

    const servico =
        document.getElementById("servicoManual").value;

    if (!paciente || !data || !hora || !servico) {

        alert("Preencha todos os campos.");

        return;
    }

    if (horarioOcupado(data, hora)) {

        alert("Este horário já está ocupado.");

        atualizarHorariosManuais();

        return;
    }

    agendamentos.push({
        paciente: paciente,
        data: data,
        hora: hora,
        servico: servico,
        criadoEm: new Date().toISOString()
    });

    salvarAgendamentos();

    document.getElementById("pacienteManual").value = "";
    document.getElementById("dataManual").value = "";
    document.getElementById("horaManual").innerHTML =
        '<option value="">Selecione uma data primeiro</option>';
    document.getElementById("servicoManual").value = "";

    renderizarAgendamentos();

    atualizarResumo();

    alert("Agendamento realizado com sucesso!");
}


function salvarAgendamentos() {

    localStorage.setItem(
        "agendamentosAtendeIA",
        JSON.stringify(agendamentos)
    );
}


function excluirAgendamento(index) {

    if (!confirm("Deseja excluir este agendamento?")) {
        return;
    }

    agendamentos.splice(index, 1);

    salvarAgendamentos();

    renderizarAgendamentos();

    atualizarResumo();
}


function renderizarAgendamentos() {

    const lista =
        document.getElementById("listaAgendamentos");

    lista.innerHTML = "";

    if (agendamentos.length === 0) {

        lista.innerHTML =
            '<p class="pequeno">Nenhum agendamento cadastrado.</p>';

        return;
    }

    const ordenados =
        [...agendamentos].sort(function(a, b) {

            return (
                (a.data + a.hora)
                .localeCompare(b.data + b.hora)
            );

        });

    ordenados.forEach(function(agendamento) {

        const index =
            agendamentos.indexOf(agendamento);

        const div =
            document.createElement("div");

        div.className = "agendamento-item";

        div.innerHTML = `
            👤 <strong>${escaparHTML(agendamento.paciente)}</strong><br>
            📅 ${formatarData(agendamento.data)}<br>
            🕐 ${escaparHTML(agendamento.hora)}<br>
            💆 ${escaparHTML(agendamento.servico)}

            <br><br>

            <button
                class="btn-danger"
                onclick="excluirAgendamento(${index})"
            >
                🗑️ Excluir
            </button>
        `;

        lista.appendChild(div);
    });
}


/* =========================================================
   HORÁRIOS MANUAIS
========================================================= */

function atualizarHorariosManuais() {

    const data =
        document.getElementById("dataManual").value;

    const select =
        document.getElementById("horaManual");

    select.innerHTML = "";

    if (!data) {

        select.innerHTML =
            '<option value="">Selecione uma data primeiro</option>';

        return;
    }

    const hoje = new Date();

    hoje.setHours(0, 0, 0, 0);

    const dataEscolhida =
        new Date(data + "T00:00:00");

    if (dataEscolhida < hoje) {

        select.innerHTML =
            '<option value="">Data inválida</option>';

        return;
    }

    const disponiveis =
        obterHorariosDisponiveis(data);

    if (disponiveis.length === 0) {

        select.innerHTML =
            '<option value="">Nenhum horário disponível</option>';

        return;
    }

    select.innerHTML =
        '<option value="">Selecione o horário</option>';

    disponiveis.forEach(function(hora) {

        const option =
            document.createElement("option");

        option.value = hora;

        option.textContent = hora;

        select.appendChild(option);
    });
}


/* =========================================================
   VERIFICAÇÃO DE HORÁRIO
========================================================= */

function horarioOcupado(data, hora) {

    return agendamentos.some(function(agendamento) {

        return (
            agendamento.data === data &&
            agendamento.hora === hora
        );

    });
}


function obterHorariosDisponiveis(data) {

    return horariosDisponiveis.filter(function(hora) {

        return !horarioOcupado(data, hora);

    });
}


/* =========================================================
   CHAT
========================================================= */

function iniciarChat() {

    const chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    const mensagem =
        configIA.mensagemInicial ||
        "Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?";

    adicionarMensagem("ana", mensagem);
}


function reiniciarChat() {

    estadoAgendamento = {
        ativo: false,
        etapa: "",
        paciente: "",
        servico: "",
        data: "",
        hora: ""
    };

    iniciarChat();
}


function adicionarMensagem(tipo, texto) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className =
        "mensagem " + tipo;

    const balao =
        document.createElement("div");

    balao.className = "balao";

    balao.innerHTML =
        escaparHTML(texto).replace(/\n/g, "<br>");

    div.appendChild(balao);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


function adicionarHTMLChat(html) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className = "mensagem ana";

    const balao =
        document.createElement("div");

    balao.className = "balao";

    balao.innerHTML = html;

    div.appendChild(balao);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}


/* =========================================================
   ENVIO DA MENSAGEM
========================================================= */

function enviarMensagem() {

    const input =
        document.getElementById("entradaChat");

    const texto =
        input.value.trim();

    if (!texto) {
        return;
    }

    adicionarMensagem("usuario", texto);

    input.value = "";

    responder(texto);
}


/* =========================================================
   RESPONDER
========================================================= */

function responder(texto) {

    const textoNormalizado =
        normalizarTexto(texto);

    /* AGENDAMENTO ATIVO */

    if (estadoAgendamento.ativo) {

        processarAgendamento(texto);

        return;
    }


    /* AGENDAR */

    if (
        textoNormalizado.includes("agendar") ||
        textoNormalizado.includes("agendamento") ||
        textoNormalizado.includes("marcar") ||
        textoNormalizado.includes("consulta") ||
        textoNormalizado.includes("horario")
    ) {

        iniciarAgendamento();

        return;
    }


    /* SERVIÇOS */

    if (
        textoNormalizado.includes("servico") ||
        textoNormalizado.includes("servicos") ||
        textoNormalizado.includes("tratamento") ||
        textoNormalizado.includes("preco") ||
        textoNormalizado.includes("valor") ||
        textoNormalizado.includes("valores")
    ) {

        responderServicos();

        return;
    }


    /* HORÁRIOS */

    if (
        textoNormalizado.includes("horario") ||
        textoNormalizado.includes("horarios") ||
        textoNormalizado.includes("atendimento")
    ) {

        adicionarMensagem(
            "ana",
            "Nosso horário de atendimento é das 08:00 às 18:00, com horários de 1 em 1 hora."
        );

        return;
    }


    /* SAUDAÇÃO */

    if (
        textoNormalizado === "oi" ||
        textoNormalizado === "ola" ||
        textoNormalizado === "bom dia" ||
        textoNormalizado === "boa tarde" ||
        textoNormalizado === "boa noite"
    ) {

        adicionarMensagem(
            "ana",
            "Olá! 😊 Sou a Ana. Posso informar nossos serviços e valores ou ajudar você a realizar um agendamento."
        );

        return;
    }


    /* AGRADECIMENTO */

    if (
        textoNormalizado.includes("obrigado") ||
        textoNormalizado.includes("obrigada")
    ) {

        adicionarMensagem(
            "ana",
            "Por nada! 😊 Estou à disposição. Se precisar, posso ajudar com nossos serviços ou agendamento."
        );

        return;
    }


    /* RESPOSTA PADRÃO */

    adicionarMensagem(
        "ana",
        "Claro! 😊 Posso ajudar você com:\n\n• Serviços e valores\n• Agendamento\n• Horários disponíveis\n\nO que você gostaria de saber?"
    );
}


/* =========================================================
   SERVIÇOS NO CHAT
========================================================= */

function responderServicos() {

    if (servicos.length === 0) {

        adicionarMensagem(
            "ana",
            "No momento não há serviços cadastrados."
        );

        return;
    }

    let resposta =
        "Claro! 😊 Estes são nossos serviços:\n\n";

    servicos.forEach(function(servico) {

        resposta +=
            "• " +
            servico.nome +
            " — R$ " +
            servico.valor +
            "\n";
    });

    resposta +=
        "\nSe quiser, posso ajudar você a realizar um agendamento.";

    adicionarMensagem("ana", resposta);
}


/* =========================================================
   INICIAR AGENDAMENTO
========================================================= */

function iniciarAgendamento() {

    if (servicos.length === 0) {

        adicionarMensagem(
            "ana",
            "No momento não há serviços cadastrados para agendamento."
        );

        return;
    }

    estadoAgendamento = {
        ativo: true,
        etapa: "nome",
        paciente: "",
        servico: "",
        data: "",
        hora: ""
    };

    adicionarMensagem(
        "ana",
        "Perfeito! 😊 Vamos realizar seu agendamento.\n\nQual é o seu nome?"
    );
}


/* =========================================================
   PROCESSAR AGENDAMENTO
========================================================= */

function processarAgendamento(texto) {

    /* NOME */

    if (estadoAgendamento.etapa === "nome") {

        if (texto.trim().length < 2) {

            adicionarMensagem(
                "ana",
                "Por favor, informe seu nome completo."
            );

            return;
        }

        estadoAgendamento.paciente =
            texto.trim();

        estadoAgendamento.etapa =
            "servico";

        let mensagem =
            "Prazer! 😊\n\nQual serviço você deseja agendar?\n\n";

        servicos.forEach(function(servico, index) {

            mensagem +=
                (index + 1) +
                "️⃣ " +
                servico.nome +
                " — R$ " +
                servico.valor +
                "\n";
        });

        adicionarMensagem("ana", mensagem);

        return;
    }


    /* SERVIÇO */

    if (estadoAgendamento.etapa === "servico") {

        let servicoEscolhido =
            encontrarServico(texto);

        if (!servicoEscolhido) {

            adicionarMensagem(
                "ana",
                "Não consegui identificar o serviço. 😊\n\nEscolha um dos serviços abaixo:"
            );

            responderServicos();

            return;
        }

        estadoAgendamento.servico =
            servicoEscolhido.nome;

        estadoAgendamento.etapa =
            "data";

        adicionarMensagem(
            "ana",
            "Ótimo! Você escolheu " +
            servicoEscolhido.nome +
            ".\n\nQual data você deseja? Informe no formato DD/MM/AAAA."
        );

        return;
    }


    /* DATA */

    if (estadoAgendamento.etapa === "data") {

        const data =
            converterDataParaISO(texto);

        if (!data) {

            adicionarMensagem(
                "ana",
                "Não consegui entender a data. 😊\n\nInforme no formato DD/MM/AAAA.\nExemplo: 20/09/2026"
            );

            return;
        }

        if (dataPassou(data)) {

            adicionarMensagem(
                "ana",
                "Essa data já passou. Por favor, escolha uma data de hoje em diante."
            );

            return;
        }

        estadoAgendamento.data = data;

        estadoAgendamento.etapa =
            "hora";

        mostrarHorariosNoChat(data);

        return;
    }


    /* HORA */

    if (estadoAgendamento.etapa === "hora") {

        const hora =
            normalizarHora(texto);

        if (!hora) {

            adicionarMensagem(
                "ana",
                "Informe um horário válido, como 08:00 ou 14:00."
            );

            mostrarHorariosNoChat(
                estadoAgendamento.data
            );

            return;
        }

        selecionarHorarioChat(hora);

        return;
    }


    /* CONFIRMAÇÃO */

    if (estadoAgendamento.etapa === "confirmacao") {

        const resposta =
            normalizarTexto(texto);

        if (
            resposta === "sim" ||
            resposta === "s" ||
            resposta.includes("confirm")
        ) {

            confirmarAgendamento();

            return;
        }

        if (
            resposta === "nao" ||
            resposta === "n" ||
            resposta.includes("cancel")
        ) {

            estadoAgendamento = {
                ativo: false,
                etapa: "",
                paciente: "",
                servico: "",
                data: "",
                hora: ""
            };

            adicionarMensagem(
                "ana",
                "Tudo bem! 😊 O agendamento não foi realizado. Se quiser, podemos começar novamente."
            );

            return;
        }

        adicionarMensagem(
            "ana",
            "Por favor, responda SIM para confirmar ou NÃO para cancelar."
        );
    }
}


/* =========================================================
   MOSTRAR BOTÕES DE HORÁRIO
========================================================= */

function mostrarHorariosNoChat(data) {

    const disponiveis =
        obterHorariosDisponiveis(data);

    if (disponiveis.length === 0) {

        adicionarMensagem(
            "ana",
            "Poxa! 😔 Todos os horários dessa data já estão ocupados.\n\nPor favor, escolha outra data."
        );

        adicionarHTMLChat(`
            <div class="acao-data">
                <button
                    class="btn-outra-data"
                    onclick="escolherOutraData()"
                >
                    📅 Escolher outra data
                </button>
            </div>
        `);

        return;
    }

    adicionarMensagem(
        "ana",
        "Perfeito! 😊\n\nEstes são os horários disponíveis para " +
        formatarData(data) +
        ":\n\nEscolha um horário abaixo:"
    );

    const div =
        document.createElement("div");

    div.className =
        "mensagem ana";

    const balao =
        document.createElement("div");

    balao.className = "balao";

    const horarios =
        document.createElement("div");

    horarios.className =
        "horarios-chat";

    disponiveis.forEach(function(hora) {

        const botao =
            document.createElement("button");

        botao.className =
            "horario-btn";

        botao.textContent =
            hora;

        botao.onclick = function() {

            selecionarHorarioChat(hora);

        };

        horarios.appendChild(botao);
    });

    balao.appendChild(horarios);

    const textoManual =
        document.createElement("div");

    textoManual.className =
        "pequeno";

    textoManual.innerHTML =
        "Você também pode digitar o horário manualmente.";

    balao.appendChild(textoManual);

    div.appendChild(balao);

    document.getElementById("chat")
        .appendChild(div);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}


/* =========================================================
   SELECIONAR HORÁRIO PELO BOTÃO
========================================================= */

function selecionarHorarioChat(hora) {

    if (estadoAgendamento.etapa !== "hora") {
        return;
    }

    if (!horariosDisponiveis.includes(hora)) {

        adicionarMensagem(
            "ana",
            "Esse horário não está disponível."
        );

        mostrarHorariosNoChat(
            estadoAgendamento.data
        );

        return;
    }

    if (
        horarioOcupado(
            estadoAgendamento.data,
            hora
        )
    ) {

        adicionarMensagem(
            "ana",
            "Esse horário acabou de ser ocupado. 😔\n\nEscolha outro horário."
        );

        mostrarHorariosNoChat(
            estadoAgendamento.data
        );

        return;
    }

    estadoAgendamento.hora = hora;

    adicionarMensagem(
        "usuario",
        hora
    );

    estadoAgendamento.etapa =
        "confirmacao";

    mostrarConfirmacao();
}


/* =========================================================
   ESCOLHER OUTRA DATA
========================================================= */

function escolherOutraData() {

    estadoAgendamento.etapa = "data";

    adicionarMensagem(
        "ana",
        "Claro! 😊\n\nQual nova data você deseja? Informe no formato DD/MM/AAAA."
    );
}


/* =========================================================
   CONFIRMAÇÃO
========================================================= */

function mostrarConfirmacao() {

    const servico =
        servicos.find(function(item) {

            return item.nome ===
                estadoAgendamento.servico;

        });

    const valor =
        servico ? servico.valor : "";

    const texto =
        "Confira seu agendamento:\n\n" +
        "👤 Paciente: " +
        estadoAgendamento.paciente +
        "\n\n" +
        "💆 Serviço: " +
        estadoAgendamento.servico +
        "\n" +
        "💰 Valor: R$ " +
        valor +
        "\n\n" +
        "📅 Data: " +
        formatarData(estadoAgendamento.data) +
        "\n" +
        "🕐 Horário: " +
        estadoAgendamento.hora +
        "\n\n" +
        "Deseja confirmar o agendamento?";

    adicionarMensagem("ana", texto);

    adicionarHTMLChat(`
        <div class="confirmacao">
            <strong>Confirmar agendamento?</strong>

            <div class="botoes-confirmacao">

                <button
                    class="btn-success"
                    onclick="confirmarAgendamento()"
                >
                    ✅ SIM
                </button>

                <button
                    class="btn-danger"
                    onclick="cancelarAgendamento()"
                >
                    ❌ NÃO
                </button>

            </div>
        </div>
    `);
}


/* =========================================================
   CONFIRMAR
========================================================= */

function confirmarAgendamento() {

    if (
        horarioOcupado(
            estadoAgendamento.data,
            estadoAgendamento.hora
        )
    ) {

        adicionarMensagem(
            "ana",
            "Esse horário acabou de ser ocupado por outro agendamento. 😔\n\nVou mostrar os horários disponíveis novamente."
        );

        estadoAgendamento.etapa =
            "hora";

        mostrarHorariosNoChat(
            estadoAgendamento.data
        );

        return;
    }

    agendamentos.push({

        paciente:
            estadoAgendamento.paciente,

        servico:
            estadoAgendamento.servico,

        data:
            estadoAgendamento.data,

        hora:
            estadoAgendamento.hora,

        criadoEm:
            new Date().toISOString()

    });

    salvarAgendamentos();

    const data =
        estadoAgendamento.data;

    const hora =
        estadoAgendamento.hora;

    const servico =
        estadoAgendamento.servico;

    const paciente =
        estadoAgendamento.paciente;

    estadoAgendamento = {
        ativo: false,
        etapa: "",
        paciente: "",
        servico: "",
        data: "",
        hora: ""
    };

    renderizarAgendamentos();

    atualizarResumo();

    adicionarMensagem(
        "ana",
        "🎉 Agendamento confirmado com sucesso!\n\n" +
        "👤 " + paciente +
        "\n" +
        "💆 " + servico +
        "\n" +
        "📅 " + formatarData(data) +
        "\n" +
        "🕐 " + hora +
        "\n\n" +
        "Agradecemos pela preferência! 😊"
    );
}


/* =========================================================
   CANCELAR
========================================================= */

function cancelarAgendamento() {

    estadoAgendamento = {
        ativo: false,
        etapa: "",
        paciente: "",
        servico: "",
        data: "",
        hora: ""
    };

    adicionarMensagem(
        "ana",
        "Tudo bem! 😊 O agendamento foi cancelado. Se precisar, estou à disposição."
    );
}


/* =========================================================
   ENCONTRAR SERVIÇO
========================================================= */

function encontrarServico(texto) {

    const normalizado =
        normalizarTexto(texto);

    const numero =
        parseInt(texto.trim());

    if (
        !isNaN(numero) &&
        numero >= 1 &&
        numero <= servicos.length
    ) {

        return servicos[numero - 1];
    }

    return servicos.find(function(servico) {

        return normalizarTexto(servico.nome) ===
            normalizado;

    }) || servicos.find(function(servico) {

        return normalizarTexto(servico.nome)
            .includes(normalizado);

    });
}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function normalizarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
}


function normalizarHora(texto) {

    let hora =
        texto
        .toLowerCase()
        .trim()
        .replace("h", ":")
        .replace(".", ":");

    const partes =
        hora.split(":");

    if (partes.length !== 2) {
        return null;
    }

    let h =
        parseInt(partes[0]);

    let m =
        parseInt(partes[1]);

    if (
        isNaN(h) ||
        isNaN(m) ||
        h < 0 ||
        h > 23 ||
        m < 0 ||
        m > 59
    ) {

        return null;
    }

    const resultado =
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0");

    if (
        !horariosDisponiveis.includes(resultado)
    ) {

        return null;
    }

    return resultado;
}


function converterDataParaISO(texto) {

    texto = texto.trim();

    let partes =
        texto.split("/");

    if (partes.length === 3) {

        const dia =
            partes[0].padStart(2, "0");

        const mes =
            partes[1].padStart(2, "0");

        const ano =
            partes[2];

        if (
            ano.length !== 4 ||
            parseInt(mes) < 1 ||
            parseInt(mes) > 12 ||
            parseInt(dia) < 1 ||
            parseInt(dia) > 31
        ) {

            return null;
        }

        const data =
            ano + "-" + mes + "-" + dia;

        const teste =
            new Date(data + "T00:00:00");

        if (isNaN(teste.getTime())) {
            return null;
        }

        return data;
    }

    if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) {

        const teste =
            new Date(texto + "T00:00:00");

        if (!isNaN(teste.getTime())) {
            return texto;
        }
    }

    return null;
}


function dataPassou(data) {

    const hoje =
        new Date();

    hoje.setHours(0, 0, 0, 0);

    const escolhida =
        new Date(data + "T00:00:00");

    return escolhida < hoje;
}


function formatarData(data) {

    if (!data) {
        return "";
    }

    const partes =
        data.split("-");

    if (partes.length !== 3) {
        return data;
    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );
}


function escaparHTML(texto) {

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

    document.getElementById("totalServicos")
        .textContent =
        servicos.length;

    document.getElementById("totalAgendamentos")
        .textContent =
        agendamentos.length;

    const hoje =
        new Date();

    const ano =
        hoje.getFullYear();

    const mes =
        String(hoje.getMonth() + 1)
        .padStart(2, "0");

    const dia =
        String(hoje.getDate())
        .padStart(2, "0");

    const hojeISO =
        ano + "-" + mes + "-" + dia;

    const quantidadeHoje =
        agendamentos.filter(function(item) {

            return item.data === hojeISO;

        }).length;

    document.getElementById("agendamentosHoje")
        .textContent =
        quantidadeHoje;
}

</script>
