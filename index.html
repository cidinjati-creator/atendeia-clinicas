<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtendeIA - Ana Assistente Virtual</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef1f5;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:26px;
}

header p{
    margin-top:5px;
    opacity:.9;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
    color:#075e54;
    margin-bottom:15px;
}

input,select,button,textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    background:#075e54;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.btn-secundario{
    background:#128c7e;
}

.btn-excluir{
    background:#c62828;
}

.item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
}

.chat{
    background:#e5ddd5;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #ccc;
}

.chat-header{
    background:#075e54;
    color:white;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#075e54;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:bold;
}

.chat-info strong{
    display:block;
    font-size:17px;
}

.chat-info span{
    font-size:12px;
    color:#d8f5ef;
}

.chat-body{
    min-height:430px;
    max-height:600px;
    overflow-y:auto;
    padding:15px;
    background:#efe7de;
}

.mensagem{
    max-width:82%;
    padding:10px 13px;
    margin-bottom:10px;
    border-radius:12px;
    line-height:1.4;
    font-size:15px;
    white-space:pre-line;
}

.mensagem.ana{
    background:white;
    margin-right:auto;
    border-top-left-radius:3px;
}

.mensagem.usuario{
    background:#d9fdd3;
    margin-left:auto;
    border-top-right-radius:3px;
}

.chat-input{
    background:#f0f0f0;
    padding:10px;
    display:flex;
    gap:8px;
}

.chat-input input{
    margin:0;
    flex:1;
    border-radius:22px;
}

.chat-input button{
    width:55px;
    margin:0;
    border-radius:50%;
    padding:10px;
}

.horarios-chat{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:10px 0;
}

.horario-btn{
    background:#128c7e;
    color:white;
    border:none;
    padding:10px 5px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.horario-btn.ocupado{
    background:#999;
    cursor:not-allowed;
}

.datas-chat{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:10px 0;
}

.data-btn{
    background:#075e54;
    color:white;
    border:none;
    padding:10px 5px;
    border-radius:8px;
    cursor:pointer;
}

.confirmacao-box{
    background:#d9fdd3;
    border-left:5px solid #075e54;
    padding:12px;
    border-radius:8px;
    margin-top:8px;
}

.resumo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.resumo-box{
    background:#075e54;
    color:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.resumo-box strong{
    display:block;
    font-size:28px;
}

@media(max-width:600px){
    .container{
        padding:8px;
    }

    .resumo-grid{
        grid-template-columns:1fr;
    }

    .mensagem{
        max-width:90%;
    }
}
</style>
</head>

<body>

<header>
    <h1>AtendeIA</h1>
    <p>Gestão de Clínicas com Ana - Assistente Virtual</p>
</header>

<div class="container">

<!-- DADOS DA CLÍNICA -->
<div class="card">
    <h2>🏥 Dados da Clínica</h2>

    <input id="nomeClinica" placeholder="Nome da clínica">
    <input id="telefoneClinica" placeholder="WhatsApp / Telefone">
    <input id="enderecoClinica" placeholder="Endereço">
    <input id="horarioClinica" placeholder="Horário de atendimento">

    <button onclick="salvarClinica()">Salvar dados da clínica</button>
</div>


<!-- CONFIGURAÇÃO DA ANA -->
<div class="card">
    <h2>🤖 Configuração do Atendente IA</h2>

    <input id="nomeIA" placeholder="Nome da atendente">

    <textarea id="mensagemInicial" rows="4"
    placeholder="Mensagem inicial"></textarea>

    <textarea id="instrucoesIA" rows="5"
    placeholder="Instruções da atendente"></textarea>

    <button onclick="salvarConfigIA()">Salvar configuração da Ana</button>
</div>


<!-- SERVIÇOS -->
<div class="card">
    <h2>💼 Serviços da Clínica</h2>

    <input id="nomeServico" placeholder="Nome do serviço">

    <input id="precoServico"
    type="number"
    step="0.01"
    placeholder="Valor">

    <button onclick="adicionarServico()">Adicionar serviço</button>

    <div id="listaServicos"></div>
</div>


<!-- AGENDAMENTO MANUAL -->
<div class="card">
    <h2>📅 Agendamento Manual</h2>

    <input id="pacienteManual" placeholder="Nome do paciente">

    <input id="dataManual" type="date"
    onchange="atualizarHorariosManual()">

    <select id="horaManual">
        <option value="">Selecione a data primeiro</option>
    </select>

    <select id="servicoManual"></select>

    <button onclick="salvarAgendamentoManual()">
        Salvar agendamento
    </button>
</div>


<!-- CHAT -->
<div class="card">

    <h2>💬 Chat da Ana</h2>

    <div class="chat">

        <div class="chat-header">

            <div class="avatar">
                A
            </div>

            <div class="chat-info">
                <strong id="nomeAnaChat">Ana</strong>
                <span>● Online</span>
            </div>

        </div>

        <div id="chatBody" class="chat-body"></div>

        <div class="chat-input">

            <input
                id="entradaChat"
                placeholder="Digite sua mensagem..."
                onkeydown="if(event.key==='Enter') enviarMensagem()">

            <button onclick="enviarMensagem()">➤</button>

        </div>

    </div>

</div>


<!-- RESUMO -->
<div class="card">

    <h2>📊 Resumo</h2>

    <div class="resumo-grid">

        <div class="resumo-box">
            <strong id="totalServicos">0</strong>
            Serviços
        </div>

        <div class="resumo-box">
            <strong id="totalAgendamentos">0</strong>
            Agendamentos
        </div>

        <div class="resumo-box">
            <strong id="agendamentosHoje">0</strong>
            Hoje
        </div>

    </div>

</div>

</div>


<script>

let servicos =
JSON.parse(localStorage.getItem("servicosAtendeIA") || "[]");

let agendamentos =
JSON.parse(localStorage.getItem("agendamentosAtendeIA") || "[]");

let configIA =
JSON.parse(localStorage.getItem("configIAAtendeIA") || "{}");

let clinica =
JSON.parse(localStorage.getItem("clinicaAtendeIA") || "{}");


let estadoAgendamento = {
    ativo:false,
    etapa:"",
    paciente:"",
    servico:"",
    data:"",
    hora:""
};


const horariosDisponiveis = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
];


function normalizarTexto(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}


function formatarMoeda(valor){

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


function dataHoje(){

    let d = new Date();

    let ano = d.getFullYear();

    let mes = String(d.getMonth()+1).padStart(2,"0");

    let dia = String(d.getDate()).padStart(2,"0");

    return `${ano}-${mes}-${dia}`;
}


function formatarData(data){

    if(!data) return "";

    let partes = data.split("-");

    if(partes.length !== 3) return data;

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


function converterDataParaISO(texto){

    texto = texto.trim();

    if(/^\d{4}-\d{2}-\d{2}$/.test(texto)){
        return texto;
    }

    if(/^\d{2}\/\d{2}\/\d{4}$/.test(texto)){

        let p = texto.split("/");

        return `${p[2]}-${p[1]}-${p[0]}`;
    }

    return null;
}


function dataPassou(data){

    return data < dataHoje();
}


function salvarClinica(){

    clinica = {

        nome:document.getElementById("nomeClinica").value.trim(),

        telefone:document.getElementById("telefoneClinica").value.trim(),

        endereco:document.getElementById("enderecoClinica").value.trim(),

        horario:document.getElementById("horarioClinica").value.trim()

    };

    localStorage.setItem(
        "clinicaAtendeIA",
        JSON.stringify(clinica)
    );

    alert("Dados da clínica salvos!");

}


function carregarClinica(){

    document.getElementById("nomeClinica").value =
    clinica.nome || "";

    document.getElementById("telefoneClinica").value =
    clinica.telefone || "";

    document.getElementById("enderecoClinica").value =
    clinica.endereco || "";

    document.getElementById("horarioClinica").value =
    clinica.horario || "08:00 às 18:00";
}


function salvarConfigIA(){

    configIA = {

        nome:
        document.getElementById("nomeIA").value.trim() || "Ana",

        mensagem:
        document.getElementById("mensagemInicial").value.trim(),

        instrucoes:
        document.getElementById("instrucoesIA").value.trim()

    };

    localStorage.setItem(
        "configIAAtendeIA",
        JSON.stringify(configIA)
    );

    document.getElementById("nomeAnaChat").innerText =
    configIA.nome || "Ana";

    alert("Configuração da Ana salva!");

}


function carregarConfigIA(){

    document.getElementById("nomeIA").value =
    configIA.nome || "Ana";

    document.getElementById("mensagemInicial").value =
    configIA.mensagem ||
    "Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?";

    document.getElementById("instrucoesIA").value =
    configIA.instrucoes ||
    "Seja cordial, profissional e natural. Informe serviços, valores, horários, endereço e WhatsApp cadastrados. Ajude clientes com agendamentos. Não invente informações. Não repita a mesma resposta sem necessidade.";

    document.getElementById("nomeAnaChat").innerText =
    configIA.nome || "Ana";
}


function adicionarServico(){

    let nome =
    document.getElementById("nomeServico").value.trim();

    let preco =
    document.getElementById("precoServico").value;

    if(!nome){

        alert("Digite o nome do serviço.");

        return;
    }

    servicos.push({

        nome:nome,

        preco:Number(preco || 0)

    });

    localStorage.setItem(
        "servicosAtendeIA",
        JSON.stringify(servicos)
    );

    document.getElementById("nomeServico").value = "";

    document.getElementById("precoServico").value = "";

    atualizarServicos();

}


function excluirServico(index){

    servicos.splice(index,1);

    localStorage.setItem(
        "servicosAtendeIA",
        JSON.stringify(servicos)
    );

    atualizarServicos();
}


function atualizarServicos(){

    let lista =
    document.getElementById("listaServicos");

    lista.innerHTML = "";

    if(servicos.length === 0){

        servicos.push({
            nome:"Tratamento",
            preco:120
        });

        localStorage.setItem(
            "servicosAtendeIA",
            JSON.stringify(servicos)
        );
    }


    servicos.forEach((s,index)=>{

        let div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <strong>${s.nome}</strong><br>
            ${formatarMoeda(s.preco)}
            <button
                class="btn-excluir"
                onclick="excluirServico(${index})">
                Excluir
            </button>
        `;

        lista.appendChild(div);

    });


    atualizarSelectServicos();

    atualizarResumo();

}


function atualizarSelectServicos(){

    let select =
    document.getElementById("servicoManual");

    select.innerHTML =
    '<option value="">Selecione o serviço</option>';

    servicos.forEach(s=>{

        let option =
        document.createElement("option");

        option.value = s.nome;

        option.textContent =
        `${s.nome} - ${formatarMoeda(s.preco)}`;

        select.appendChild(option);

    });
}


function servicoExiste(nome){

    let busca = normalizarTexto(nome);

    return servicos.find(
        s => normalizarTexto(s.nome) === busca
    );
}


function horarioOcupado(data,hora){

    return agendamentos.some(
        a => a.data === data && a.hora === hora
    );
}


function atualizarHorariosManual(){

    let data =
    document.getElementById("dataManual").value;

    let select =
    document.getElementById("horaManual");

    select.innerHTML =
    '<option value="">Selecione o horário</option>';

    if(!data) return;


    horariosDisponiveis.forEach(hora=>{

        let option =
        document.createElement("option");

        option.value = hora;

        if(horarioOcupado(data,hora)){

            option.textContent =
            `${hora} - OCUPADO`;

            option.disabled = true;

        }else{

            option.textContent = hora;
        }

        select.appendChild(option);

    });

}


function salvarAgendamentoManual(){

    let paciente =
    document.getElementById("pacienteManual").value.trim();

    let data =
    document.getElementById("dataManual").value;

    let hora =
    document.getElementById("horaManual").value;

    let servico =
    document.getElementById("servicoManual").value;


    if(!paciente || !data || !hora || !servico){

        alert("Preencha todos os campos.");

        return;
    }


    if(dataPassou(data)){

        alert("Não é possível agendar uma data que já passou.");

        return;
    }


    if(horarioOcupado(data,hora)){

        alert("Este horário já está ocupado.");

        atualizarHorariosManual();

        return;
    }


    agendamentos.push({

        paciente,
        data,
        hora,
        servico

    });


    localStorage.setItem(
        "agendamentosAtendeIA",
        JSON.stringify(agendamentos)
    );


    alert(
        `Agendamento realizado!\n\nPaciente: ${paciente}\nServiço: ${servico}\nData: ${formatarData(data)}\nHorário: ${hora}`
    );


    document.getElementById("pacienteManual").value = "";

    document.getElementById("dataManual").value = "";

    document.getElementById("horaManual").innerHTML =
    '<option value="">Selecione a data primeiro</option>';

    document.getElementById("servicoManual").value = "";


    atualizarResumo();
}


function adicionarMensagem(texto,tipo){

    let chat =
    document.getElementById("chatBody");

    let div =
    document.createElement("div");

    div.className =
    `mensagem ${tipo}`;

    div.textContent = texto;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}


function adicionarMensagemHTML(html,tipo){

    let chat =
    document.getElementById("chatBody");

    let div =
    document.createElement("div");

    div.className =
    `mensagem ${tipo}`;

    div.innerHTML = html;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}


function enviarMensagem(){

    let input =
    document.getElementById("entradaChat");

    let texto =
    input.value.trim();

    if(!texto) return;

    adicionarMensagem(texto,"usuario");

    input.value = "";

    setTimeout(()=>{

        responder(texto);

    },300);

}


function responder(texto){

    let t = normalizarTexto(texto);


    if(estadoAgendamento.ativo){

        processarAgendamento(texto);

        return;
    }


    if(
        t.includes("agendar") ||
        t.includes("agendamento") ||
        t.includes("marcar") ||
        t.includes("consulta")
    ){

        iniciarAgendamento();

        return;
    }


    if(
        t.includes("preco") ||
        t.includes("preço") ||
        t.includes("valor") ||
        t.includes("servico") ||
        t.includes("tratamento") ||
        t.includes("quanto custa")
    ){

        responderServicos();

        return;
    }


    if(
        t.includes("horario") ||
        t.includes("horários") ||
        t.includes("atendimento") ||
        t.includes("abre") ||
        t.includes("fecha")
    ){

        responderHorario();

        return;
    }


    if(
        t.includes("endereco") ||
        t.includes("onde fica") ||
        t.includes("localizacao") ||
        t.includes("localização")
    ){

        responderEndereco();

        return;
    }


    if(
        t.includes("whatsapp") ||
        t.includes("telefone") ||
        t.includes("contato") ||
        t.includes("numero")
    ){

        responderContato();

        return;
    }


    if(
        t === "oi" ||
        t === "ola" ||
        t === "olá" ||
        t.includes("bom dia") ||
        t.includes("boa tarde") ||
        t.includes("boa noite")
    ){

        adicionarMensagem(
            "Olá! 😊 Seja muito bem-vinda. Sou a Ana, assistente virtual da nossa clínica. Posso ajudar com serviços, valores, horários e agendamentos.",
            "ana"
        );

        return;
    }


    if(
        t.includes("obrigado") ||
        t.includes("obrigada") ||
        t.includes("valeu")
    ){

        adicionarMensagem(
            "Por nada! 😊 Estou à disposição para ajudar.",
            "ana"
        );

        return;
    }


    if(
        t.includes("ajuda") ||
        t.includes("o que voce faz") ||
        t.includes("o que você faz")
    ){

        adicionarMensagem(
            "Posso ajudar você com:\n\n• Serviços e valores\n• Horários de atendimento\n• Endereço da clínica\n• WhatsApp/telefone\n• Agendamento de atendimento",
            "ana"
        );

        return;
    }


    adicionarMensagem(
        "Entendi 😊 Posso ajudar você com serviços, valores, horários ou agendamento. O que você gostaria de saber?",
        "ana"
    );

}


function responderServicos(){

    if(servicos.length === 0){

        adicionarMensagem(
            "No momento não há serviços cadastrados.",
            "ana"
        );

        return;
    }


    let texto =
    "Claro! 😊 Estes são nossos serviços:\n\n";

    servicos.forEach(s=>{

        texto +=
        `• ${s.nome} — ${formatarMoeda(s.preco)}\n`;

    });


    texto +=
    "\nSe quiser, posso também fazer um agendamento para você.";

    adicionarMensagem(texto,"ana");
}


function responderHorario(){

    let horario =
    clinica.horario || "08:00 às 18:00";

    adicionarMensagem(
        `Nosso horário de atendimento é das ${horario}. 😊\n\nOs horários disponíveis para agendamento são de hora em hora, das 08:00 às 18:00.`,
        "ana"
    );
}


function responderEndereco(){

    if(!clinica.endereco){

        adicionarMensagem(
            "O endereço da clínica ainda não foi cadastrado no sistema.",
            "ana"
        );

        return;
    }


    adicionarMensagem(
        `📍 Nosso endereço é:\n${clinica.endereco}`,
        "ana"
    );
}


function responderContato(){

    if(!clinica.telefone){

        adicionarMensagem(
            "O WhatsApp/telefone da clínica ainda não foi cadastrado.",
            "ana"
        );

        return;
    }


    adicionarMensagem(
        `📱 Você pode falar conosco pelo WhatsApp/telefone:\n${clinica.telefone}`,
        "ana"
    );
}


function iniciarAgendamento(){

    estadoAgendamento = {

        ativo:true,

        etapa:"nome",

        paciente:"",

        servico:"",

        data:"",

        hora:""

    };


    adicionarMensagem(
        "Claro! 😊 Vamos fazer seu agendamento.\n\nPrimeiro, qual é o seu nome?",
        "ana"
    );

}


function processarAgendamento(texto){

    if(estadoAgendamento.etapa === "nome"){

        estadoAgendamento.paciente =
        texto.trim();

        estadoAgendamento.etapa =
        "servico";


        let lista =
        "Perfeito! 😊 Agora escolha o serviço:\n\n";

        servicos.forEach((s,index)=>{

            lista +=
            `${index+1}. ${s.nome} — ${formatarMoeda(s.preco)}\n`;

        });


        adicionarMensagem(
            lista,
            "ana"
        );

        return;
    }


    if(estadoAgendamento.etapa === "servico"){

        let servico =
        servicoExiste(texto);


        if(!servico){

            let numero =
            parseInt(texto);

            if(
                !isNaN(numero) &&
                numero >= 1 &&
                numero <= servicos.length
            ){

                servico =
                servicos[numero-1];

            }

        }


        if(!servico){

            adicionarMensagem(
                "Não encontrei esse serviço. Por favor, escolha um dos serviços apresentados.",
                "ana"
            );

            return;
        }


        estadoAgendamento.servico =
        servico.nome;

        estadoAgendamento.etapa =
        "data";


        adicionarMensagem(
            "Ótimo! 📅 Agora informe a data desejada.\n\nVocê pode digitar no formato DD/MM/AAAA.",
            "ana"
        );


        mostrarDatasNoChat();

        return;
    }


    if(estadoAgendamento.etapa === "data"){

        let data =
        converterDataParaISO(texto);


        if(!data){

            adicionarMensagem(
                "Não consegui identificar a data. Digite, por exemplo: 20/09/2026.",
                "ana"
            );

            return;
        }


        if(dataPassou(data)){

            adicionarMensagem(
                "Essa data já passou. Por favor, escolha uma data de hoje em diante.",
                "ana"
            );

            return;
        }


        estadoAgendamento.data =
        data;

        estadoAgendamento.etapa =
        "hora";


        adicionarMensagem(
            `Data escolhida: ${formatarData(data)}.\n\nAgora escolha um horário disponível:`,
            "ana"
        );


        mostrarHorariosNoChat(data);

        return;
    }


    if(estadoAgendamento.etapa === "hora"){

        let hora =
        normalizarHora(texto);


        if(!hora){

            adicionarMensagem(
                "Escolha um dos horários disponíveis apresentados acima.",
                "ana"
            );

            return;
        }


        if(horarioOcupado(
            estadoAgendamento.data,
            hora
        )){

            adicionarMensagem(
                "Esse horário acabou de ser ocupado. Por favor, escolha outro.",
                "ana"
            );

            mostrarHorariosNoChat(
                estadoAgendamento.data
            );

            return;
        }


        estadoAgendamento.hora =
        hora;

        estadoAgendamento.etapa =
        "confirmacao";


        adicionarMensagem(
            `Confira seu agendamento:\n\n👤 Nome: ${estadoAgendamento.paciente}\n💼 Serviço: ${estadoAgendamento.servico}\n📅 Data: ${formatarData(estadoAgendamento.data)}\n⏰ Horário: ${estadoAgendamento.hora}\n\nDeseja confirmar? Digite SIM ou NÃO.`,
            "ana"
        );

        return;
    }


    if(estadoAgendamento.etapa === "confirmacao"){

        let resposta =
        normalizarTexto(texto);


        if(
            resposta === "sim" ||
            resposta === "s" ||
            resposta.includes("confirmo")
        ){

            confirmarAgendamento();

            return;
        }


        if(
            resposta === "nao" ||
            resposta === "n"
        ){

            estadoAgendamento.ativo = false;

            adicionarMensagem(
                "Tudo bem 😊 O agendamento foi cancelado. Se quiser, podemos começar novamente.",
                "ana"
            );

            return;
        }


        adicionarMensagem(
            "Por favor, responda SIM para confirmar ou NÃO para cancelar.",
            "ana"
        );
    }

}


function normalizarHora(texto){

    let t =
    normalizarTexto(texto)
    .replace("h",":")
    .replace(".",":");


    if(/^\d{1,2}$/.test(t)){

        t =
        String(parseInt(t)).padStart(2,"0") + ":00";

    }


    if(!/^\d{1,2}:\d{2}$/.test(t)){

        return null;
    }


    let p =
    t.split(":");


    let hora =
    String(parseInt(p[0])).padStart(2,"0");

    let minuto =
    p[1];


    let resultado =
    `${hora}:${minuto}`;


    if(
        !horariosDisponiveis.includes(resultado)
    ){

        return null;
    }


    return resultado;
}


function mostrarDatasNoChat(){

    let hoje =
    new Date();

    let html =
    '<div class="datas-chat">';


    for(let i=0;i<7;i++){

        let d =
        new Date(hoje);

        d.setDate(
            hoje.getDate()+i
        );


        let ano =
        d.getFullYear();

        let mes =
        String(d.getMonth()+1).padStart(2,"0");

        let dia =
        String(d.getDate()).padStart(2,"0");


        let iso =
        `${ano}-${mes}-${dia}`;


        let exibicao =
        `${dia}/${mes}`;


        html += `
            <button
                class="data-btn"
                onclick="selecionarDataChat('${iso}')">
                ${exibicao}
            </button>
        `;

    }


    html += "</div>";


    adicionarMensagemHTML(
        html,
        "ana"
    );
}


function selecionarDataChat(data){

    if(dataPassou(data)) return;


    estadoAgendamento.data =
    data;

    estadoAgendamento.etapa =
    "hora";


    adicionarMensagem(
        formatarData(data),
        "usuario"
    );


    adicionarMensagem(
        "Perfeito! Agora escolha um horário disponível:",
        "ana"
    );


    mostrarHorariosNoChat(data);
}


function mostrarHorariosNoChat(data){

    let html =
    '<div class="horarios-chat">';


    horariosDisponiveis.forEach(hora=>{

        let ocupado =
        horarioOcupado(data,hora);


        html += `
            <button
                class="horario-btn ${ocupado ? "ocupado" : ""}"
                ${ocupado ? "disabled" : ""}
                onclick="selecionarHorarioChat('${hora}')">
                ${hora}${ocupado ? " ✕" : ""}
            </button>
        `;

    });


    html += "</div>";


    adicionarMensagemHTML(
        html,
        "ana"
    );
}


function selecionarHorarioChat(hora){

    if(horarioOcupado(
        estadoAgendamento.data,
        hora
    )){

        adicionarMensagem(
            "Esse horário já está ocupado. Escolha outro.",
            "ana"
        );

        mostrarHorariosNoChat(
            estadoAgendamento.data
        );

        return;
    }


    estadoAgendamento.hora =
    hora;

    estadoAgendamento.etapa =
    "confirmacao";


    adicionarMensagem(
        hora,
        "usuario"
    );


    adicionarMensagem(
        `Confira seu agendamento:\n\n👤 Nome: ${estadoAgendamento.paciente}\n💼 Serviço: ${estadoAgendamento.servico}\n📅 Data: ${formatarData(estadoAgendamento.data)}\n⏰ Horário: ${estadoAgendamento.hora}\n\nDeseja confirmar? Digite SIM ou NÃO.`,
        "ana"
    );
}


function confirmarAgendamento(){

    if(horarioOcupado(
        estadoAgendamento.data,
        estadoAgendamento.hora
    )){

        adicionarMensagem(
            "Esse horário acabou de ser ocupado. Vamos escolher outro horário.",
            "ana"
        );

        estadoAgendamento.etapa =
        "hora";

        mostrarHorariosNoChat(
            estadoAgendamento.data
        );

        return;
    }


    agendamentos.push({

        paciente:
        estadoAgendamento.paciente,

        servico:
        estadoAgendamento.servico,

        data:
        estadoAgendamento.data,

        hora:
        estadoAgendamento.hora

    });


    localStorage.setItem(
        "agendamentosAtendeIA",
        JSON.stringify(agendamentos)
    );


    adicionarMensagem(
        `✅ Agendamento confirmado!\n\n👤 ${estadoAgendamento.paciente}\n💼 ${estadoAgendamento.servico}\n📅 ${formatarData(estadoAgendamento.data)}\n⏰ ${estadoAgendamento.hora}\n\nAguardamos você! 😊`,
        "ana"
    );


    estadoAgendamento = {

        ativo:false,

        etapa:"",

        paciente:"",

        servico:"",

        data:"",

        hora:""

    };


    atualizarResumo();
}


function atualizarResumo(){

    document.getElementById("totalServicos")
    .innerText = servicos.length;


    document.getElementById("totalAgendamentos")
    .innerText = agendamentos.length;


    let hoje =
    dataHoje();


    let totalHoje =
    agendamentos.filter(
        a => a.data === hoje
    ).length;


    document.getElementById("agendamentosHoje")
    .innerText = totalHoje;
}


function iniciarChat(){

    let mensagem =
    configIA.mensagem ||
    "Olá! Seja bem-vinda à nossa clínica! 😊 Sou a Ana, assistente virtual. Posso ajudar você com informações sobre nossos serviços, valores e agendamentos. Como posso ajudar você hoje?";


    adicionarMensagem(
        mensagem,
        "ana"
    );
}


carregarClinica();

carregarConfigIA();

atualizarServicos();

atualizarResumo();

iniciarChat();

</script>
